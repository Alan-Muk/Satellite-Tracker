name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'satellite-tracker-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'satellite-tracker-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite-tracker-backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: satellite-tracker-backend

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all